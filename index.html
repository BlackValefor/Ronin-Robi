<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robi, o Ronin — Ficha</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#9c2b23">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --washi:#f2e9d3;
    --washi-dark:#e6d6ac;
    --washi-deep:#d9c592;
    --sumi:#221b14;
    --sumi-soft:#4a4033;
    --shu:#9c2b23;
    --shu-dark:#711d18;
    --gold:#af8a3e;
    --gold-light:#d8bd7c;
    --indigo:#2c3c56;
    --font-display:'Shippori Mincho', serif;
    --font-body:'Noto Sans JP','Noto Sans',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(175,138,62,0.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(156,43,35,0.08), transparent 50%),
      var(--washi);
    font-family:var(--font-body);
    color:var(--sumi);
    padding:18px 10px 60px;
  }
  .scroll{
    max-width:760px;
    margin:0 auto;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 12%),
      var(--washi);
    border:1px solid var(--gold);
    border-radius:14px;
    box-shadow:0 12px 34px rgba(34,27,20,0.22), inset 0 0 0 6px rgba(255,255,255,0.15);
    position:relative;
    overflow:hidden;
  }
  .scroll::before, .scroll::after{
    content:"";
    position:absolute; left:0; right:0; height:14px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 10px, var(--gold-light) 10px 20px);
    opacity:0.55;
  }
  .scroll::before{ top:0; }
  .scroll::after{ bottom:0; }

  header{
    position:relative;
    background:linear-gradient(135deg, var(--shu-dark), var(--shu) 60%, var(--shu-dark));
    padding:22px 20px 20px 20px;
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:14px;
  }
  .waves{ height:10px; background:var(--washi);
    -webkit-mask: radial-gradient(circle at 8px -2px, transparent 9px, black 9.5px) 0 0/16px 100% repeat-x;
            mask: radial-gradient(circle at 8px -2px, transparent 9px, black 9.5px) 0 0/16px 100% repeat-x;
    background:var(--gold-light);
  }
  .seal{
    position:relative;
    width:82px; height:82px; min-width:82px;
    border-radius:50%;
    border:3px solid var(--gold-light);
    background:var(--sumi-soft) center/cover no-repeat;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.35);
    color:var(--washi);
    font-family:var(--font-display);
    font-size:11px;
    text-align:center;
    line-height:1.2;
    transition:transform .15s ease;
  }
  .seal:hover{ transform:scale(1.04); }
  .seal img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .seal .hint{ padding:6px; }
  .seal input{ display:none; }
  .titles{ color:var(--washi); flex:1; min-width:0; }
  .titles h1{
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(22px,5vw,32px);
    margin:0 0 4px 0;
    letter-spacing:0.5px;
  }
  .titles .sub{
    font-size:12.5px;
    color:var(--gold-light);
    font-style:italic;
  }
  .titles .sub input{
    background:transparent;border:none;color:var(--gold-light);
    font-style:italic;font-family:var(--font-body);font-size:12.5px;
    width:100%;
  }
  .titles h1 input{
    background:transparent;border:none;color:var(--washi);
    font-family:var(--font-display);font-weight:800;font-size:inherit;
    width:100%; padding:0;
  }
  .titles input:focus{ outline:1px dashed var(--gold-light); }

  section{ padding:16px 20px; }
  .section-title{
    display:flex; align-items:center; gap:8px;
    background:var(--shu-dark);
    color:var(--washi);
    font-family:var(--font-display);
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    padding:7px 12px;
    border-radius:6px;
    margin-bottom:12px;
    box-shadow:0 2px 0 rgba(0,0,0,0.15);
  }
  .section-title .mon{ color:var(--gold-light); font-size:15px; }

  /* Attributes */
  .attrs{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
  }
  @media (max-width:640px){ .attrs{ grid-template-columns:repeat(3,1fr);} }
  .attr-card{
    background:var(--washi-dark);
    border:1px solid var(--gold);
    border-radius:8px;
    padding:8px 6px 10px;
    text-align:center;
  }
  .attr-card .abbr{ font-family:var(--font-display); font-weight:700; color:var(--shu-dark); font-size:14px;}
  .attr-card .name{ font-size:8.5px; color:var(--sumi-soft); margin-bottom:6px;}
  .attr-card input.val{
    width:100%; text-align:center; font-family:var(--font-mono); font-weight:700;
    font-size:20px; border:1px solid var(--gold); border-radius:5px; background:#fbf5e6;
    padding:3px 0; margin-bottom:4px; color:var(--sumi);
  }
  .attr-card .mod-row{ font-size:8px; color:var(--sumi-soft); }
  .attr-card input.mod{
    width:100%; text-align:center; font-family:var(--font-mono); font-weight:600;
    font-size:13px; border:1px solid var(--gold-light); border-radius:5px; background:#fbf5e6;
    padding:2px 0; color:var(--shu-dark);
  }

  /* Combat */
  .combat{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  @media (max-width:640px){ .combat{ grid-template-columns:repeat(2,1fr);} }
  .stat-card{
    background:var(--washi-dark); border:1px solid var(--gold); border-radius:8px;
    padding:10px 6px; text-align:center;
  }
  .stat-card .label{ font-size:8.5px; color:var(--sumi-soft); text-transform:uppercase; letter-spacing:.5px;}
  .stat-card input{
    width:100%; text-align:center; font-family:var(--font-mono); font-weight:700; font-size:19px;
    border:1px solid var(--gold-light); border-radius:5px; background:#fbf5e6; margin-top:5px; padding:3px 0;
    color:var(--indigo);
  }

  /* two column */
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .two-col{ grid-template-columns:1fr; } }

  .list-row{ display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .list-row input[type=text]{
    flex:1; border:none; border-bottom:1px solid var(--gold); background:transparent;
    padding:4px 2px; font-size:13px; font-family:var(--font-body); color:var(--sumi);
  }
  .list-row input[type=checkbox]{ accent-color:var(--shu); width:16px; height:16px; }
  .del-btn{
    border:none; background:none; color:var(--shu); cursor:pointer; font-size:15px; opacity:0.55;
    padding:0 4px; line-height:1;
  }
  .del-btn:hover{ opacity:1; }
  .add-btn{
    margin-top:4px; border:1px dashed var(--gold); background:none; color:var(--shu-dark);
    font-family:var(--font-body); font-size:12px; padding:5px 10px; border-radius:6px; cursor:pointer;
  }
  .add-btn:hover{ background:rgba(175,138,62,0.12); }
  .eq-item{ display:flex; align-items:baseline; gap:8px; margin-bottom:5px; }
  .eq-item .name{ font-weight:700; font-size:12.5px; }
  .eq-item input.name-in{ font-weight:700; border:none; border-bottom:1px solid var(--gold); background:transparent; font-size:12.5px; flex:0 0 45%;}
  .eq-item input.dmg-in{ border:none; border-bottom:1px solid var(--gold-light); background:transparent; font-size:11.5px; flex:1; text-align:right; color:var(--sumi-soft); }

  /* table */
  table{ width:100%; border-collapse:collapse; font-size:11.5px; }
  th{
    background:var(--shu-dark); color:var(--washi); font-family:var(--font-display); font-weight:700;
    font-size:10px; padding:6px 4px; text-transform:uppercase; letter-spacing:.4px;
  }
  td{ border:1px solid var(--gold-light); padding:0; }
  td input{
    width:100%; border:none; background:transparent; padding:6px 4px; font-size:11.5px;
    font-family:var(--font-body); color:var(--sumi);
  }
  td input:focus, .list-row input:focus, .attr-card input:focus, .stat-card input:focus{
    outline:2px solid var(--shu); outline-offset:-1px; background:#fffaf0;
  }
  .table-wrap{ overflow-x:auto; }

  textarea{
    width:100%; min-height:110px; border:1px solid var(--gold); border-radius:8px;
    background:#fbf5e6; padding:10px; font-family:var(--font-body); font-size:13px; color:var(--sumi);
    resize:vertical;
  }

  .toolbar{
    display:flex; flex-wrap:wrap; gap:10px; padding:16px 20px 22px;
    justify-content:center; align-items:center;
  }
  .btn{
    font-family:var(--font-display); font-weight:700; letter-spacing:.5px; font-size:13px;
    border:none; padding:10px 18px; border-radius:8px; cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,0.2);
    transition:transform .1s ease;
  }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.2); }
  .btn-primary{ background:var(--shu); color:var(--washi); }
  .btn-ghost{ background:var(--washi-dark); color:var(--sumi); border:1px solid var(--gold); box-shadow:none; }
  .btn-danger{ background:var(--indigo); color:var(--washi); }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--sumi); color:var(--washi); padding:9px 18px; border-radius:20px;
    font-size:12.5px; opacity:0; transition:all .25s ease; pointer-events:none;
    font-family:var(--font-body); box-shadow:0 6px 18px rgba(0,0,0,0.3);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .divider{ height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); margin:4px 0 16px; }

  @media print{
    body{ background:white; padding:0; }
    .scroll{ box-shadow:none; border:none; }
    .toolbar{ display:none; }
    input, textarea{ border:none !important; background:transparent !important; }
  }
</style>
</head>
<body>

<div class="scroll">
  <header>
    <label class="seal" id="sealLabel">
      <span class="hint" id="sealHint">Toque para<br>foto</span>
      <input type="file" id="portraitInput" accept="image/*">
    </label>
    <div class="titles">
      <h1><input id="charName" value="ROBI, O RONIN" spellcheck="false"></h1>
      <div class="sub"><input id="charSub" value="Guerreiro (Kensei) — Nível 1 · Antecedente: Ronin · Neutro e Bom" spellcheck="false"></div>
    </div>
  </header>
  <div class="waves"></div>

  <section>
    <div class="section-title"><span class="mon">⚔</span> ATRIBUTOS</div>
    <div class="attrs" id="attrsGrid"></div>
  </section>

  <section>
    <div class="section-title"><span class="mon">⚔</span> COMBATE</div>
    <div class="combat" id="combatGrid"></div>
  </section>

  <section>
    <div class="two-col">
      <div>
        <div class="section-title"><span class="mon">✓</span> PERÍCIAS</div>
        <div id="skillsList"></div>
        <button class="add-btn" id="addSkill">+ adicionar perícia</button>
      </div>
      <div>
        <div class="section-title"><span class="mon">⚔</span> EQUIPAMENTO</div>
        <div id="eqList"></div>
        <button class="add-btn" id="addEq">+ adicionar item</button>
      </div>
    </div>
  </section>

  <section>
    <div class="section-title"><span class="mon">⚔</span> AÇÕES DE ATAQUE</div>
    <div class="table-wrap">
      <table id="atkTable">
        <thead><tr><th>Arma</th><th>Bônus</th><th>Dano / Tipo</th><th>Alcance</th><th>Notas</th><th></th></tr></thead>
        <tbody id="atkBody"></tbody>
      </table>
    </div>
    <button class="add-btn" id="addAtk">+ adicionar ataque</button>
  </section>

  <section>
    <div class="section-title"><span class="mon">✎</span> EVOLUÇÃO DE ATRIBUTOS</div>
    <div class="table-wrap">
      <table id="evoTable">
        <thead><tr><th>Nív.</th><th>FOR</th><th>DES</th><th>CON</th><th>INT</th><th>SAB</th><th>CAR</th><th>PV Máx</th><th>Motivo</th><th></th></tr></thead>
        <tbody id="evoBody"></tbody>
      </table>
    </div>
    <button class="add-btn" id="addEvo">+ adicionar linha</button>
  </section>

  <section>
    <div class="section-title"><span class="mon">✎</span> ANOTAÇÕES E HISTÓRIA</div>
    <textarea id="notes" placeholder="Escreva aqui a história, motivações e anotações da sessão..."></textarea>
  </section>

  <div class="divider"></div>
  <div class="toolbar">
    <button class="btn btn-primary" id="saveBtn">Salvar</button>
    <button class="btn btn-ghost" id="printBtn">Exportar / Imprimir</button>
    <button class="btn btn-danger" id="resetBtn">Restaurar ficha original</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'robi-ronin-sheet';

const defaultState = {
  name: "ROBI, O RONIN",
  sub: "Guerreiro (Kensei) — Nível 1 · Antecedente: Ronin · Neutro e Bom",
  portrait: null,
  attrs: [
    {abbr:'FOR', name:'Força', val:'16', mod:'+3'},
    {abbr:'DES', name:'Destreza', val:'14', mod:'+2'},
    {abbr:'CON', name:'Constituição', val:'14', mod:'+2'},
    {abbr:'INT', name:'Inteligência', val:'10', mod:'+0'},
    {abbr:'SAB', name:'Sabedoria', val:'12', mod:'+1'},
    {abbr:'CAR', name:'Carisma', val:'8', mod:'-1'},
  ],
  combat: [
    {label:'PV', val:'12'},
    {label:'CA', val:'15'},
    {label:'Desloc.', val:'9m'},
    {label:'Proficiência', val:'+2'},
  ],
  skills: [
    {name:'Atletismo', checked:true},
    {name:'Percepção', checked:true},
    {name:'Sobrevivência', checked:true},
    {name:'Intimidação', checked:true},
  ],
  equipment: [
    {name:'Katana', extra:'1d8 cort. (1d10 duas mãos)'},
    {name:'Wakizashi', extra:'1d6 perf.'},
    {name:'Roupas de viagem desgastadas', extra:''},
    {name:'Quimono escuro', extra:''},
    {name:'Suprimentos (5 dias)', extra:''},
    {name:'Amuleto de proteção desgastado', extra:''},
  ],
  attacks: [
    {arma:'Katana', bonus:'', dano:'1d8 cort. / 1d10 (2mãos)', alcance:'corpo a corpo', notas:''},
    {arma:'Wakizashi', bonus:'', dano:'1d6 perf.', alcance:'corpo a corpo', notas:''},
  ],
  evolution: [
    {niv:'1', for_:'16', des:'14', con:'14', int_:'10', sab:'12', car:'8', pvmax:'12', motivo:'Início'},
  ],
  notes: ""
};

let state = JSON.parse(JSON.stringify(defaultState));
let saveTimeout = null;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign(JSON.parse(JSON.stringify(defaultState)), parsed);
    }
  }catch(e){
    console.log('Nenhum dado salvo ainda, usando ficha padrão.');
  }
  renderAll();
}

function scheduleSave(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveState, 500);
}

async function saveState(manual){
  try{
    const result = await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    if(manual) showToast(result ? 'Ficha salva ✓' : 'Não foi possível salvar');
  }catch(e){
    if(manual) showToast('Erro ao salvar');
    console.error(e);
  }
}

/* ---------- render ---------- */
function renderAll(){
  document.getElementById('charName').value = state.name;
  document.getElementById('charSub').value = state.sub;
  renderPortrait();
  renderAttrs();
  renderCombat();
  renderSkills();
  renderEquipment();
  renderAttacks();
  renderEvolution();
  document.getElementById('notes').value = state.notes;
}

function renderPortrait(){
  const label = document.getElementById('sealLabel');
  const hint = document.getElementById('sealHint');
  let img = label.querySelector('img');
  if(state.portrait){
    if(!img){
      img = document.createElement('img');
      label.insertBefore(img, label.firstChild);
    }
    img.src = state.portrait;
    hint.style.display = 'none';
  } else {
    if(img) img.remove();
    hint.style.display = 'block';
  }
}

function renderAttrs(){
  const grid = document.getElementById('attrsGrid');
  grid.innerHTML = '';
  state.attrs.forEach((a, i)=>{
    const card = document.createElement('div');
    card.className = 'attr-card';
    card.innerHTML = `
      <div class="abbr">${a.abbr}</div>
      <div class="name">${a.name}</div>
      <input class="val" value="${a.val}" data-i="${i}" data-f="val">
      <div class="mod-row">mod.</div>
      <input class="mod" value="${a.mod}" data-i="${i}" data-f="mod">
    `;
    grid.appendChild(card);
  });
  grid.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = +e.target.dataset.i, f = e.target.dataset.f;
      state.attrs[i][f] = e.target.value;
      scheduleSave();
    });
  });
}

function renderCombat(){
  const grid = document.getElementById('combatGrid');
  grid.innerHTML = '';
  state.combat.forEach((s, i)=>{
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML = `<div class="label">${s.label}</div><input value="${s.val}" data-i="${i}">`;
    grid.appendChild(card);
  });
  grid.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      state.combat[+e.target.dataset.i].val = e.target.value;
      scheduleSave();
    });
  });
}

function renderSkills(){
  const list = document.getElementById('skillsList');
  list.innerHTML = '';
  state.skills.forEach((s, i)=>{
    const row = document.createElement('div');
    row.className = 'list-row';
    row.innerHTML = `
      <input type="checkbox" ${s.checked?'checked':''} data-i="${i}" data-f="checked">
      <input type="text" value="${s.name}" data-i="${i}" data-f="name">
      <button class="del-btn" data-i="${i}" title="remover">✕</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('input[type=checkbox]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      state.skills[+e.target.dataset.i].checked = e.target.checked;
      scheduleSave();
    });
  });
  list.querySelectorAll('input[type=text]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      state.skills[+e.target.dataset.i].name = e.target.value;
      scheduleSave();
    });
  });
  list.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state.skills.splice(+e.target.dataset.i, 1);
      renderSkills(); scheduleSave();
    });
  });
}

function renderEquipment(){
  const list = document.getElementById('eqList');
  list.innerHTML = '';
  state.equipment.forEach((it, i)=>{
    const row = document.createElement('div');
    row.className = 'eq-item';
    row.innerHTML = `
      <input class="name-in" value="${it.name}" data-i="${i}" data-f="name">
      <input class="dmg-in" value="${it.extra}" data-i="${i}" data-f="extra" placeholder="dano / obs.">
      <button class="del-btn" data-i="${i}" title="remover">✕</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('.name-in, .dmg-in').forEach(inp=>{
    inp.addEventListener('input', e=>{
      state.equipment[+e.target.dataset.i][e.target.dataset.f] = e.target.value;
      scheduleSave();
    });
  });
  list.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state.equipment.splice(+e.target.dataset.i, 1);
      renderEquipment(); scheduleSave();
    });
  });
}

function renderAttacks(){
  const body = document.getElementById('atkBody');
  body.innerHTML = '';
  const fields = ['arma','bonus','dano','alcance','notas'];
  state.attacks.forEach((row, i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = fields.map(f=>`<td><input value="${row[f]||''}" data-i="${i}" data-f="${f}"></td>`).join('')
      + `<td><button class="del-btn" data-i="${i}">✕</button></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      state.attacks[+e.target.dataset.i][e.target.dataset.f] = e.target.value;
      scheduleSave();
    });
  });
  body.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state.attacks.splice(+e.target.dataset.i, 1);
      renderAttacks(); scheduleSave();
    });
  });
}

function renderEvolution(){
  const body = document.getElementById('evoBody');
  body.innerHTML = '';
  const fields = ['niv','for_','des','con','int_','sab','car','pvmax','motivo'];
  state.evolution.forEach((row, i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = fields.map(f=>`<td><input value="${row[f]||''}" data-i="${i}" data-f="${f}"></td>`).join('')
      + `<td><button class="del-btn" data-i="${i}">✕</button></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      state.evolution[+e.target.dataset.i][e.target.dataset.f] = e.target.value;
      scheduleSave();
    });
  });
  body.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state.evolution.splice(+e.target.dataset.i, 1);
      renderEvolution(); scheduleSave();
    });
  });
}

/* ---------- events ---------- */
document.getElementById('charName').addEventListener('input', e=>{ state.name = e.target.value; scheduleSave(); });
document.getElementById('charSub').addEventListener('input', e=>{ state.sub = e.target.value; scheduleSave(); });
document.getElementById('notes').addEventListener('input', e=>{ state.notes = e.target.value; scheduleSave(); });

document.getElementById('addSkill').addEventListener('click', ()=>{
  state.skills.push({name:'', checked:false});
  renderSkills(); scheduleSave();
});
document.getElementById('addEq').addEventListener('click', ()=>{
  state.equipment.push({name:'', extra:''});
  renderEquipment(); scheduleSave();
});
document.getElementById('addAtk').addEventListener('click', ()=>{
  state.attacks.push({arma:'', bonus:'', dano:'', alcance:'', notas:''});
  renderAttacks(); scheduleSave();
});
document.getElementById('addEvo').addEventListener('click', ()=>{
  state.evolution.push({niv:'', for_:'', des:'', con:'', int_:'', sab:'', car:'', pvmax:'', motivo:''});
  renderEvolution(); scheduleSave();
});

document.getElementById('portraitInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    state.portrait = ev.target.result;
    renderPortrait();
    scheduleSave();
  };
  reader.readAsDataURL(file);
});

document.getElementById('saveBtn').addEventListener('click', ()=> saveState(true));
document.getElementById('printBtn').addEventListener('click', ()=> window.print());
document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(confirm('Isso vai apagar suas edições e voltar para a ficha original de Robi. Continuar?')){
    state = JSON.parse(JSON.stringify(defaultState));
    renderAll();
    await saveState(true);
  }
});

loadState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
